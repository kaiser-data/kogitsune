# kogitsune 🦊 — example kits config
# Copy to ../kits.yaml and edit. The fox merges MCP server definitions from
# ~/.claude/mcp-on-demand.json by name, so you only reference them here.

# Always rides along — never a toggle.
# repack is pinned deliberately: it is the escape hatch for a wrong pack, so it has to
# be present *before* you know you need it. A catalog entry cannot do that — acquiring
# it would cost the restart that repack exists to avoid.
# Where rules packs live. Set this to a directory that is NOT inside any `.claude`
# dir: the harness auto-loads `<ancestor>/.claude/rules/**` from the working
# directory's ancestors, so packs kept under ~/.claude/rules reach every session and
# no kit can gate them. `kit doctor` detects this and prints the move.
# Precedence: this key > $KOGITSUNE_RULES_DIR > ~/.claude/rules
rules_root: "~/.claude-rules"

pinned:
  memory:     { plugin: "claude-mem@thedotmack" }
  guardrails: { import: "~/.claude/rules/guardrails.md" }
  graphify:   { skill: "graphify" }
  repack:     { skill: "repack" }

# Built-in harness tools — the largest block in any session (~27.6K measured 2026-08-09),
# and until now the one axis no kit could touch. A `permissions.deny` entry with a bare
# tool name strips that tool's schema from the request payload, so denying what a kit
# will never call is a real saving, not just a guardrail.
#
# A kit opts in with `harness: [group, ...]` — an ALLOWLIST: groups named are kept,
# every other group is denied. Omit the key entirely and nothing is denied, so kits
# written before this axis existed are unaffected.
#
# Asymmetry worth respecting: settings.json is read once at startup, so a wrongly denied
# tool cannot be recovered by `repack` the way a missing skill can — it needs a full
# restart. Deny groups a kit is *certain* not to need; when unsure, keep them.
# Essentials (Bash/Read/Edit/Write/Skill/ToolSearch/AskUserQuestion/TaskOutput/TaskStop)
# are never deniable, whatever a group lists.
harness:
  agents:    { weight: 8653, tools: [Workflow, Agent, SendMessage, ListAgents] }
  tasks:     { weight: 2173, tools: [TaskCreate, TaskUpdate, TaskList, TaskGet] }
  design:    { weight: 2331, tools: [DesignSync] }
  watch:     { weight: 1915, tools: [Monitor] }
  cron:      { weight: 2062, tools: [CronCreate, CronDelete, CronList, ScheduleWakeup] }
  worktrees: { weight: 1653, tools: [EnterWorktree, ExitWorktree] }
  web:       { weight:  950, tools: [WebSearch, WebFetch] }
  remote:    { weight:  916, tools: [RemoteTrigger, PushNotification] }
  review:    { weight:  571, tools: [ReportFindings] }
  mcp-res:   { weight:  537, tools: [ReadMcpResourceDirTool, ListMcpResourcesTool, ReadMcpResourceTool] }
  notebooks: { weight:  420, tools: [NotebookEdit] }

# Catalog of selectable items, with rough context-weight hints (tokens) for the pack-weight bar.
catalog:
  mcp:
    supabase:         { weight: 10000, tag: "🔴" }
    n8n-mcp:          { weight: 12000, tag: "🔴" }
    notion:           { weight: 4000,  tag: "🟠" }
    dify-superclaude: { weight: 3000,  tag: "🟠" }
    kitsune:          { weight: 700,   tag: "🟢" }   # the lean big sibling (measured Δ 2026-07-11: ~590-780)
    kitsune-forge:    { weight: 2000,  tag: "🟡" }
    context7:         { weight: 1000,  tag: "🟢" }
    # a plugin-bundled MCP re-exposed as an explicit opt-in (see gate_mcp below):
    chrome-devtools:  { weight: 1000,  tag: "🟢", def: { command: "npx", args: ["-y", "chrome-devtools-mcp@latest"] } }
  skills:
    # gate_mcp: enable the plugin but drop its bundled .mcp.json from the mirror —
    # plugin MCP servers bypass --strict-mcp-config and would spawn in every session.
    ecc:              { plugin: "ecc@ecc", weight: 4200, tag: "🟡", gate_mcp: true }  # full harness (measured; content defers until invoked)
    # rules packs (dirs of *.md under ~/.claude/rules) are gated: the mirror excludes
    # the auto-loaded rules/ dir; picking one imports its files into the session CLAUDE.md.
    ecc-rules-common: { rules: "ecc/common",     weight: 4100, tag: "🟡" }
    ecc-rules-ts:     { rules: "ecc/typescript", weight: 1700, tag: "🟢" }
    ecc-rules-py:     { rules: "ecc/python",     weight: 1200, tag: "🟢" }
    postgres-bp:      { plugin: "postgres-best-practices@supabase-agent-skills", weight: 2000, tag: "🟡" }
    n8n:              { dir: "~/.claude/skills/n8n-*", count: 7, weight: 4000, tag: "🟡" }
    frontend-design:  { plugin: "frontend-design@claude-plugins-official", weight: 1000, tag: "🟢" }
    # --- process layer: superpowers (obra/superpowers) — the HOW of working.
    # Complements ECC (the WHAT): superpowers choreographs plan→TDD→review→verify→finish;
    # ECC supplies the domain steps. Precedence on overlap: guardrails > superpowers > ECC.
    # Two install modes (see `make superpowers*` / lib/install-superpowers.sh):
    #   Mode A — plugin (has a SessionStart hook that auto-injects the dispatcher every session):
    superpowers:      { plugin: "superpowers@superpowers-dev", weight: 3000, tag: "🟡" }
    #   Mode B — à la carte skills dir (same skills, no hook, trigger on demand):
    sp:               { dir: "~/.claude/_vendor/superpowers/skills/*", weight: 1500, tag: "🟢" }

# Named kits shown in the picker and launchable directly via `kit <name>`.
# Kits compose: `extends:` inherits another kit; "+name"/"-name" add or remove items.
# Optional `model:` per kit sets the launch model (opus|sonnet|haiku|full id); it's
# inherited via `extends`, overridable live in the picker (ctrl-o), and always beaten
# by an explicit `kit <name> -- --model <x>`. Omit it to use Claude Code's default.
kits:
  # kitsune rides in lean + ecc (deep/qa inherit): a small always-on gateway buys
  # on-demand access to any registry MCP (search → shapeshift → call)
  lean:     { mcp: [kitsune],          skills: [] , harness: [web] }
  db:       { model: opus, mcp: [supabase], skills: [postgres-bp], harness: [web] }
  db-heavy: { extends: db, mcp: ["+context7"] }      # inherit db (incl. model: opus), add a server
  n8n:      { mcp: [n8n-mcp],          skills: [n8n], harness: [web] }
  frontend: { model: sonnet, mcp: [], skills: [frontend-design], harness: [web, design] }
  research: { mcp: [notion, context7], skills: [], harness: [web] }
  ecc:      { mcp: [kitsune],          skills: [ecc, ecc-rules-common], harness: [agents, tasks, web, review] }  # full ECC harness + its core rules
  deep:     { extends: ecc, mcp: ["+context7"] }                 # ECC + docs lookup for heavy builds
  qa:       { extends: ecc, mcp: ["+chrome-devtools"], harness: [agents, tasks, web, review, watch] }          # ECC + interactive DevTools (traces, heap, console)

  # --- best-of-both: superpowers process layer × ECC capability layer ---
  # `kit for "<task>"` picks among these from learned experience; see the README.
  flow:     { mcp: [kitsune], skills: [sp], harness: [agents, tasks, web, review, worktrees] }                     # lean process discipline (à la carte, no hook), no ECC
  build:    { extends: ecc, model: opus, skills: ["+superpowers"] }  # ⭐ full ECC harness + superpowers methodology (plugin+hook)
  feature:  { model: opus, mcp: [kitsune], skills: [sp, ecc-rules-ts], harness: [agents, tasks, web, review, worktrees] }  # focused: process + one language's rules, no full ECC
